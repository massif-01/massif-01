name: Generate Trophy

on:
  schedule:
    - cron: "17 0 * * *" # 避开 GitHub Actions 每小时整点的调度高峰
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史

      - name: Create assets directory
        run: mkdir -p .github/assets

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=gruvbox&no-bg=true&margin-w=10&title=-Experience'
          path: .github/assets/trophy.candidate.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate trophy data
        run: |
          python3 .github/scripts/validate_trophy.py .github/assets/trophy.candidate.svg
          mv .github/assets/trophy.candidate.svg .github/assets/trophy.svg

      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/trophy.svg
          
          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "No changes to commit - trophy file is up to date"
          else
            echo "Committing changes..."
            git commit -m "Update trophy card [skip ci]"
            git push
            echo "✓ Changes pushed successfully"
          fi
