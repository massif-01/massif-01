name: Generate Trophy

on:
  schedule:
    - cron: "17 0 * * *" # 避开 GitHub Actions 每小时整点的调度高峰
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史

      - name: Create assets directory
        run: mkdir -p .github/assets

      - name: Download pinned trophy generator
        env:
          TROPHY_BINARY: ${{ runner.temp }}/github-profile-trophy
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/soulteary/github-profile-trophy/releases/download/v1.0.0/github-profile-trophy-linux-amd64 \
            --output "$TROPHY_BINARY"
          echo "0abd1d942a7bec09301c0c1325d3f2d9ea06b70d950b96c4756095808304da4b  $TROPHY_BINARY" | sha256sum --check
          chmod +x "$TROPHY_BINARY"

      - name: Verify metrics token
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          gh api graphql \
            -f query='query($login: String!) {
              viewer { login }
              rateLimit { remaining resetAt }
              user(login: $login) {
                repositories(first: 1, ownerAffiliations: OWNER) { totalCount }
              }
            }' \
            -F login="${{ github.repository_owner }}" \
            --jq '"viewer=\(.data.viewer.login) repositories=\(.data.user.repositories.totalCount) remaining=\(.data.rateLimit.remaining) resetAt=\(.data.rateLimit.resetAt)"'

      - name: Generate trophy card
        env:
          GITHUB_TOKEN1: ${{ secrets.METRICS_TOKEN }}
          TROPHY_BINARY: ${{ runner.temp }}/github-profile-trophy
        run: |
          "$TROPHY_BINARY" \
            --username="${{ github.repository_owner }}" \
            --theme=gruvbox \
            --no-bg=true \
            --margin-w=10 \
            --title=-Experience \
            --output=.github/assets/trophy.candidate.svg

      - name: Validate trophy data
        run: |
          python3 .github/scripts/validate_trophy.py .github/assets/trophy.candidate.svg
          mv .github/assets/trophy.candidate.svg .github/assets/trophy.svg

      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/trophy.svg
          
          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "No changes to commit - trophy file is up to date"
          else
            echo "Committing changes..."
            git commit -m "Update trophy card [skip ci]"
            git push
            echo "✓ Changes pushed successfully"
          fi
